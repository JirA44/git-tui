[project]
name = "git-tui"
version = "0.1.0"
description = "Git Analyzer TUI — commits/auteurs/taille en terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text="MIT"}
dependencies = ["rich>=13", "click>=8"]
[project.scripts]
git-tui = "git_tui.app:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
